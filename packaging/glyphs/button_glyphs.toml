# Generated by tools/make-button-glyphs.py from packaging/glyphs/svg; do not edit by hand.
# Rectangles are pixels in button_glyphs.dds. Alpha is straight (not premultiplied).

[sheet]
file = "button_glyphs.dds"
format = "A8R8G8B8"
alpha = "straight"
cell = 128
columns = 16
width = 2048
height = 1280

