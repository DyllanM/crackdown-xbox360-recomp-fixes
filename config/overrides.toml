# Manual analysis fixes for Crackdown (default.xex, title 4D5307DC).

[functions]
# Branch targets the analyzer does not reach; codegen Validate fails without them.
0x8252FD70 = {}
0x82357EE8 = {}
0x8247FF30 = {}
0x82516A88 = {}
0x8252E050 = {}
0x825322D8 = {}
0x82A1DD18 = {}
0x823F0668 = {}

# The rendezvous spin in sub_82A50000 (audio workers) has no kernel wait, so title termination cannot stop it.
[[midasm_hook]]
address = 0x82A500DC
name = "crackdown_audio_barrier_escape"
registers = []
after_instruction = false
return_on_true = true

# Caps the Massive title-server count in sub_82AA0920 at its 10-record stack array before the loop reads it.
[[midasm_hook]]
address = 0x82AA0A6C
name = "crackdown_massive_server_count_guard"
registers = ["r1"]
after_instruction = false

# Keeps the 360x256 AudioCore bit-grid reads of sub_82252150 near their table at 0x82D33F98; a NaN angle converts
# to an out-of-range row and column.
[[midasm_hook]]
address = 0x822541D8
name = "crackdown_visibility_grid_guard"
registers = ["r11", "r10", "r27", "r29"]
after_instruction = false

# The head look-at target and the audio listener built from it can go NaN after a ragdoll.
[[midasm_hook]]
address = 0x82252134
name = "crackdown_audio_listener_guard"
registers = ["r3", "r4"]
after_instruction = false

[[midasm_hook]]
address = 0x822A026C
name = "crackdown_look_target_guard"
registers = ["r31"]
after_instruction = false

[[midasm_hook]]
address = 0x822A2C50
name = "crackdown_look_target_guard"
registers = ["r31"]
after_instruction = false

# The ledge and slope follower divides its snap-down pull by the step's dt; scale it so it is divided by the title's
# original 1/30 s step instead.
[[midasm_hook]]
address = 0x822B5634
name = "crackdown_ledge_snap_down"
registers = ["f0"]
after_instruction = false

# A ragdoll started again on an already-ragdolled character differences a stale pose pair over the 30 FPS step instead
# of one short step (f1 = dt, r29 = character).
[[midasm_hook]]
address = 0x822BA2E8
name = "crackdown_ragdoll_pose_dt"
registers = ["f1", "r29"]
after_instruction = false

# The camera's above-water push divides the depth by its forward axis's y (f13); a level camera made it infinite.
[[midasm_hook]]
address = 0x8228FDDC
name = "crackdown_camera_lift_divisor"
registers = ["f13"]
after_instruction = false

# Sanitizes the mixed frame before XAudioSubmitRenderDriverFrame in sub_82A4BEF8; r4 is the frame address.
[[midasm_hook]]
address = 0x82A4BF40
name = "crackdown_audio_pcm_firewall"
registers = ["r4"]
after_instruction = false

# The wave safety timeout in sub_8225B0A8 adds one per update (`addi r11,r11,1`); it advances at 30 Hz at any frame rate.
[[midasm_hook]]
address = 0x8225B254
name = "crackdown_audio_wave_timeout_tick"
registers = ["r11", "r30"]
after_instruction = true

# The variable-step frame time (`li rN,16` where the fixed step would take 33 ms) follows the selected frame rate.
[[midasm_hook]]
address = 0x82287194
name = "crackdown_variable_step_frame_ms"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x82388E98
name = "crackdown_variable_step_frame_ms"
registers = ["r9"]
after_instruction = true

[[midasm_hook]]
address = 0x823F0ED8
name = "crackdown_variable_step_frame_ms"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x8248F278
name = "crackdown_variable_step_frame_ms"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x824F9D1C
name = "crackdown_variable_step_frame_ms"
registers = ["r10"]
after_instruction = true

[[midasm_hook]]
address = 0x824FB408
name = "crackdown_variable_step_frame_ms"
registers = ["r10"]
after_instruction = true

[[midasm_hook]]
address = 0x82505EF4
name = "crackdown_variable_step_frame_ms"
registers = ["r9"]
after_instruction = true

[[midasm_hook]]
address = 0x8257AB0C
name = "crackdown_variable_step_frame_ms"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
