# ReXGlue runtime settings, read from <exe dir>/crackdown.toml. The launcher's choices are saved in
# user_data/settings.toml, which is loaded after this file.

# Without a GPU plugin the runtime has no GPU emulation.
gpu_plugin = "xenos"
# The game reads resolved render targets on the CPU; without readback that memory stays stale.
readback_resolve = "fast"
# Copy back only resolves up to 256 KB; the large ones are not read on the CPU and cost frame rate.
readback_resolve_max_bytes = 262144
log_max_file_size_mb = 30
log_max_files = 2

# The guest video mode would otherwise follow the window size.
video_mode_width = 1280
video_mode_height = 720

fullscreen = false
window_width = 1280
window_height = 720
monitor = 1

# Keyboard and mouse mode (launcher toggle): the mouse turns the camera, left click fires and right click locks on.
mnk_mouse = true
keybind_right_trigger = "E,O,LMB"
keybind_left_trigger = "Q,I,RMB"
